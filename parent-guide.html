<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Eng Reem Shata — Portal Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#3753c9; --rose-deep:#283fa6; --navy:#13235c; --navy-2:#0c1840;
    --cream:#f4f7ff; --ink:#0e1526; --ink-2:#46506a; --ink-3:#7c8696;
    --line:#dde6f6; --line-2:#e9eefb; --green:#1f9d55; --amber:#d97706; --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:radial-gradient(circle at 30% 20%, #1c3380, var(--navy) 55%, var(--navy-2));
    color:#fff; min-height:100%; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .stage-wrap{width:min(960px,96vw);}
  /* progress bar */
  .pg{height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;margin-bottom:22px}
  .pg-fill{height:100%;width:0;background:linear-gradient(90deg,#7d92e8,#fff);transition:width .25s linear}
  /* brand row */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--navy);font-family:'Playfair Display',serif;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
  .brand b{font-family:'Playfair Display',serif;font-size:18px}
  .brand span{font-size:12px;color:rgba(255,255,255,.65);display:block;font-weight:500}
  /* card */
  .card{background:#fff;color:var(--ink);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
  .card-demo{padding:30px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:12px;background:linear-gradient(180deg,var(--cream),#fff)}
  .card-cap{background:#fff;border-top:1px solid var(--line-2);padding:22px 30px}
  .sec-title{font-family:'Playfair Display',serif;font-size:30px;color:var(--navy);font-weight:800}
  .sec-cap{font-size:18px;line-height:1.55;color:var(--ink-2);margin-top:8px}
  .fade{animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* ---- demos ---- */
  .hero{align-items:center;text-align:center;gap:14px}
  .hero .biglogo{width:90px;height:90px;border-radius:22px;background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-family:'Playfair Display',serif;font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .hero h2{font-family:'Playfair Display',serif;font-size:30px;color:var(--navy)}
  .hero p{color:var(--ink-3);font-size:15px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .vid{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vid-th{position:relative;height:84px;background:linear-gradient(135deg,var(--navy),var(--rose-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
  .vid-th span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:12px;font-weight:700;transform:rotate(-16deg)}
  .vid-t{padding:9px 12px;font-size:14px;font-weight:600;color:var(--navy)}
  .row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 16px;font-size:15px}
  .row b{color:var(--navy)}
  .row .sp{color:var(--ink-2)}
  .tag{margin-left:auto;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px}
  .tag.g{background:#e3f5e9;color:var(--green)} .tag.a{background:#fdecd1;color:var(--amber)} .tag.r{background:#fbe1dd;color:var(--red)}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .dot.g{background:var(--green)} .dot.a{background:var(--amber)}
  .grade{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
  .pbar{display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:12px;font-size:15px;color:var(--ink-2)}
  .pbar-tr{height:18px;background:var(--cream);border-radius:9px;overflow:hidden}
  .pbar-fl{height:100%;background:linear-gradient(90deg,var(--rose),var(--rose-deep));border-radius:9px;animation:grow .9s ease}
  @keyframes grow{from{width:0 !important}}
  .pbar b{color:var(--navy);text-align:right}
  .wall{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
  .wall .av{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wall b{color:var(--navy);font-size:15px} .wall p{font-size:14px;color:var(--ink-2);margin-top:4px}
  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.45}
  .msg.u{align-self:flex-end;background:var(--rose);color:#fff;border-bottom-right-radius:5px}
  .msg.b{align-self:flex-start;background:var(--cream);color:var(--ink);border-bottom-left-radius:5px}
  /* cover / controls */
  .cover{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%, #1c3380, var(--navy) 60%, var(--navy-2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:10;text-align:center;padding:24px}
  .cover .biglogo{width:96px;height:96px;border-radius:24px;background:#fff;color:var(--navy);font-family:'Playfair Display',serif;font-weight:800;font-size:36px;display:flex;align-items:center;justify-content:center}
  .cover h1{font-family:'Playfair Display',serif;font-size:34px}
  .cover p{color:rgba(255,255,255,.7);max-width:460px;font-size:15px;line-height:1.5}
  .play-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--navy);border:none;border-radius:999px;padding:15px 30px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 14px 36px rgba(0,0,0,.35)}
  .play-btn:hover{transform:translateY(-1px)}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.45)}
  .ctrls{display:flex;justify-content:center;gap:10px;margin-top:20px}
  .ctrls button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .ctrls button:hover{background:rgba(255,255,255,.22)}
  @media (max-width:640px){
    .sec-title{font-size:24px}.sec-cap{font-size:16px}.card-demo{min-height:240px;padding:20px}.grid{gap:10px}
  }
</style>
</head>
<body>

<audio id="vo" src="assets/parent-guide-voice.mp3" preload="auto"></audio>

<!-- start cover -->
<div class="cover" id="cover">
  <div class="biglogo">RS</div>
  <h1>Eng Reem Shata — Portal Guide</h1>
  <p>A quick tour for students and parents. Press play, then screen-record this page to share on WhatsApp.</p>
  <button class="play-btn" id="startBtn">▶ &nbsp;Play the guide</button>
</div>

<div class="stage-wrap" id="stageWrap" style="visibility:hidden">
  <div class="pg"><div class="pg-fill" id="bar"></div></div>
  <div class="brand"><div class="logo">RS</div><div><b>Eng Reem Shata</b><span>Physics · IGCSE &amp; A-Level</span></div></div>
  <div class="card">
    <div class="card-demo" id="demo"></div>
    <div class="card-cap"><div class="sec-title" id="title"></div><div class="sec-cap" id="cap"></div></div>
  </div>
  <div class="ctrls">
    <button onclick="nudge(-1)">‹ Back</button>
    <button id="pp" onclick="togglePlay()">⏸ Pause</button>
    <button onclick="nudge(1)">Next ›</button>
    <button onclick="replay()">⟲ Replay</button>
  </div>
</div>
<div class="hint">Tip: hide this with full-screen (⌃⌘F) and screen-record. The voiceover plays from the page.</div>

<script>
  // Section start times (seconds) tuned to the 82.5s Jessica voiceover, proportional to the script.
  const SECTIONS = [
    { t:0,  title:"Eng Reem Shata", cap:"Welcome to Eng Reem Shata's Physics portal. Here's a quick tour of everything it offers, for students and parents.", demo:"hero" },
    { t:8,  title:"Recordings", cap:"Re-watch every lesson, any time you need to revise. Each video shows the student's name across it, to keep it private.", demo:"rec" },
    { t:18, title:"Homework", cap:"Every assignment appears here with its due date. Just tap Submit to upload your work — and always see what's finished and what's still pending.", demo:"hw" },
    { t:31, title:"Attendance", cap:"A clear record of every lesson — present, late, or absent — so it's always easy to check.", demo:"att" },
    { t:41, title:"Marks", cap:"Every exam with the score, the percentage, and the official grade from one to nine, so progress is easy to follow.", demo:"marks" },
    { t:51, title:"My Progress", cap:"Everything together in simple charts — average marks, homework completed, and attendance — at a glance.", demo:"prog" },
    { t:62, title:"Class Wall", cap:"Where Eng Reem posts announcements and reminders for the whole class.", demo:"wall" },
    { t:68, title:"AI Study Helper", cap:"Answers physics questions any time, explaining concepts and worked examples from the IGCSE syllabus.", demo:"ai" },
    { t:76, title:"Thank you 💙", cap:"Everything in one place, whenever you need it. Thank you for learning with Eng Reem Shata.", demo:"hero2" }
  ];
  function demoHTML(k){
    if (k==="hero"||k==="hero2") return '<div class="hero"><div class="biglogo">RS</div><h2>Eng Reem Shata</h2><p>'+(k==="hero"?"Physics · IGCSE &amp; A-Level":"Physics, made simple 💙")+'</p></div>';
    if (k==="rec") return '<div class="grid">'+[1,2,3,4].map(i=>'<div class="vid"><div class="vid-th">▶<span>Student · ALS</span></div><div class="vid-t">Lesson '+i+'</div></div>').join('')+'</div>';
    if (k==="hw") return '<div class="row"><span class="dot g"></span><b>Forces &amp; Motion</b><span class="tag g">Submitted</span></div><div class="row"><span class="dot a"></span><b>Energy &amp; Power</b><span class="tag a">Pending</span></div>';
    if (k==="att") return '<div class="row"><b>04 May</b><span class="tag g">Present</span></div><div class="row"><b>11 May</b><span class="tag a">Late</span></div><div class="row"><b>18 May</b><span class="tag r">Absent</span></div>';
    if (k==="marks") return '<div class="row"><b>Mechanics</b><span class="sp">46 / 50</span><span class="sp">92%</span><span class="grade">9</span></div><div class="row"><b>Waves</b><span class="sp">30 / 40</span><span class="sp">75%</span><span class="grade">7</span></div>';
    if (k==="prog") return '<div>'+[["Average","86%",86],["Homework","90%",90],["Attendance","92%",92]].map(b=>'<div class="pbar" style="margin-bottom:12px"><span>'+b[0]+'</span><div class="pbar-tr"><div class="pbar-fl" style="width:'+b[2]+'%"></div></div><b>'+b[1]+'</b></div>').join('')+'</div>';
    if (k==="wall") return '<div class="wall"><div class="av">R</div><div><b>Eng Reem</b><p>Reminder: mock exam next Sunday — revise Mechanics &amp; Waves. 📘</p></div></div>';
    if (k==="ai") return '<div class="chat"><div class="msg u">Explain Newton\'s second law</div><div class="msg b">Force = mass × acceleration (F = ma) — it tells you how much an object speeds up for a given push…</div></div>';
    return '';
  }
  const audio = document.getElementById('vo');
  const demo = document.getElementById('demo'), title = document.getElementById('title'), cap = document.getElementById('cap'), bar = document.getElementById('bar');
  let cur = -1;
  function show(i){
    if (i === cur) return;
    cur = i; const s = SECTIONS[i];
    demo.innerHTML = demoHTML(s.demo);
    title.textContent = s.title; cap.textContent = s.cap;
    [demo,title,cap].forEach(el => { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });
  }
  function sync(){
    const ct = audio.currentTime, dur = audio.duration || 82.5;
    bar.style.width = Math.min(100, 100*ct/dur) + '%';
    let idx = 0; for (let i=0;i<SECTIONS.length;i++){ if (ct >= SECTIONS[i].t - 0.05) idx = i; }
    show(idx);
  }
  audio.addEventListener('timeupdate', sync);
  audio.addEventListener('ended', () => { bar.style.width='100%'; document.getElementById('pp').textContent='▶ Play'; });
  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('cover').style.display='none';
    document.getElementById('stageWrap').style.visibility='visible';
    show(0); audio.currentTime = 0; audio.play().catch(()=>{ /* if blocked, the controls still work */ });
  });
  window.togglePlay = () => { if (audio.paused){ audio.play(); document.getElementById('pp').textContent='⏸ Pause'; } else { audio.pause(); document.getElementById('pp').textContent='▶ Play'; } };
  window.replay = () => { audio.currentTime = 0; audio.play(); document.getElementById('pp').textContent='⏸ Pause'; };
  window.nudge = (d) => { const n = Math.max(0, Math.min(SECTIONS.length-1, cur + d)); audio.currentTime = SECTIONS[n].t + 0.1; };
  // keyboard: space=play/pause, arrows=section
  document.addEventListener('keydown', (e) => {
    if (e.code==='Space'){ e.preventDefault(); togglePlay(); }
    else if (e.key==='ArrowRight'){ nudge(1); } else if (e.key==='ArrowLeft'){ nudge(-1); }
  });
</script>
</body>
</html>
